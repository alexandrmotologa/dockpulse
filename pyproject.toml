[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockpulse"
version = "0.1.0"
description = "High-speed keyboard-driven terminal HUD and CLI for Docker and Compose"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexander Motologa", email = "68332976+alexandrmotologa@users.noreply.github.com" }
]
keywords = ["docker", "docker-compose", "tui", "terminal", "hud", "dashboard", "metrics", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27.0",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[project.scripts]
dockpulse = "dockpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dockpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
